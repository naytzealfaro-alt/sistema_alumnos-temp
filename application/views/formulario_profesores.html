<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Profesores</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
        }
        .form-control-custom {
            padding: 1.2rem 1.2rem;
            font-size: 1.1rem;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }
        .form-control-custom:focus {
            border-color: #b0d4ff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body>

    <div class="container my-5" style="max-width: 800px;">
        <!-- Título principal -->
        <h1 class="text-center fw-bold mb-5 display-5">Formulario de Profesores</h1>

        <form action="guardar_profesor.php" method="POST">

            <!-- ID Profesor -->
            <div class="mb-4">
                <input type="text" class="form-control form-control-lg form-control-custom" id="id_prof" name="id_prof" placeholder="ID Profesor" required>
            </div>

            <!-- Número de Control -->
            <div class="mb-4">
                <input type="text" class="form-control form-control-lg form-control-custom" id="nocontrol_prof" name="nocontrol_prof" maxlength="15" placeholder="Número de Control" required>
            </div>

            <!-- Nombre -->
            <div class="mb-4">
                <input type="text" class="form-control form-control-lg form-control-custom" id="nombre_prof" name="nombre_prof" maxlength="15" placeholder="Nombre del profesor" required>
            </div>

            <!-- Apellido Paterno -->
            <div class="mb-4">
                <input type="text" class="form-control form-control-lg form-control-custom" id="apellidop_prof" name="apellidop_prof" maxlength="15" placeholder="Apellido paterno" required>
            </div>

            <!-- Apellido Materno -->
            <div class="mb-4">
                <input type="text" class="form-control form-control-lg form-control-custom" id="apellidom_prof" name="apellidom_prof" maxlength="15" placeholder="Apellido materno" required>
            </div>

            <!-- Teléfono -->
            <div class="mb-4">
                <input type="tel" class="form-control form-control-lg form-control-custom" id="tel_prof" name="tel_prof" maxlength="35" placeholder="Teléfono" required>
            </div>

            <!-- Domicilio (Textarea amplio como en la captura) -->
            <div class="mb-4">
                <textarea class="form-control form-control-lg form-control-custom" id="dom_prof" name="dom_prof" rows="3" maxlength="80" placeholder="Domicilio" required></textarea>
            </div>

            <!-- Estatus (Floating label o Select personalizado) -->
            <div class="form-floating mb-4">
                <select class="form-select form-select-lg form-control-custom" id="estatus_prof" name="estatus_prof" aria-label="Estatus del profesor" required style="height: 70px; padding-top: 1.6rem;">
                    <option value="alta" selected>Alta</option>
                    <option value="baja">Baja</option>
                </select>
                <label for="estatus_prof" class="text-secondary ps-3">Estatus del profesor</label>
            </div>

            <!-- Botones -->
            <div class="d-grid gap-3 d-md-flex justify-md-end mt-4">
                <button type="submit" class="btn btn-primary btn-lg px-5 py-3 rounded-3 fs-5">Guardar</button>
                <button type="reset" class="btn btn-outline-secondary btn-lg px-4 py-3 rounded-3 fs-5">Limpiar</button>
            </div>

        </form>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
